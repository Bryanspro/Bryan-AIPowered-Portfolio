<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cyber 2048</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030508;
            --grid-bg: rgba(255, 255, 255, 0.05);
            --cell-bg: rgba(255, 255, 255, 0.05);
            --text: #e2e8f0;
            --accent-cyan: #00f0ff;
            --accent-purple: #bd00ff;
            --font: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 95%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin: 0;
        }

        .score-box {
            background: var(--grid-bg);
            padding: 5px 15px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--accent-cyan);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            background: var(--grid-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            touch-action: none;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1;
            background: var(--cell-bg);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            transition: all 0.15s ease;
        }

        .game-over {
            color: var(--accent-purple);
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            text-shadow: 0 0 10px rgba(189, 0, 255, 0.5);
        }

        .btn {
            margin-top: 20px;
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .instructions {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 20px;
        }

        /* Colors for numbers */
        .val-2 {
            color: #fff;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .val-4 {
            color: #fff;
            background: rgba(0, 240, 255, 0.25);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .val-8 {
            color: #fff;
            background: rgba(0, 240, 255, 0.35);
            border: 1px solid rgba(0, 240, 255, 0.4);
        }

        .val-16 {
            color: #fff;
            background: rgba(189, 0, 255, 0.25);
            border: 1px solid rgba(189, 0, 255, 0.3);
        }

        .val-32 {
            color: #fff;
            background: rgba(189, 0, 255, 0.35);
            border: 1px solid rgba(189, 0, 255, 0.4);
            font-size: 1.6rem;
        }

        .val-64 {
            color: #fff;
            background: rgba(189, 0, 255, 0.45);
            border: 1px solid rgba(189, 0, 255, 0.5);
            box-shadow: 0 0 10px rgba(189, 0, 255, 0.3);
            font-size: 1.6rem;
        }

        .val-128 {
            color: #fff;
            background: rgba(255, 0, 150, 0.4);
            border: 1px solid rgba(255, 0, 150, 0.5);
            box-shadow: 0 0 10px rgba(255, 0, 150, 0.4);
            font-size: 1.3rem;
        }

        .val-256 {
            color: #fff;
            background: rgba(255, 0, 150, 0.5);
            border: 1px solid rgba(255, 0, 150, 0.6);
            box-shadow: 0 0 15px rgba(255, 0, 150, 0.5);
            font-size: 1.3rem;
        }

        .val-512 {
            color: #fff;
            background: rgba(255, 100, 0, 0.5);
            border: 1px solid rgba(255, 100, 0, 0.6);
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.5);
            font-size: 1.3rem;
        }

        .val-1024 {
            color: #fff;
            background: rgba(255, 200, 0, 0.6);
            border: 1px solid rgba(255, 200, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.6);
            font-size: 1.1rem;
        }

        .val-2048 {
            color: #000;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #fff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <div class="game-container">
        <div class="header">
            <h1 class="title">2048</h1>
            <div class="score-box">Score: <span id="score">0</span></div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="game-over" id="game-over">SYSTEM FAILURE</div>
        <button class="btn" onclick="initGame()">Reboot System</button>
        <div class="instructions">Use arrow keys or swipe to move tiles. Combine tiles of the same number!</div>
    </div>

    <script>
        let grid = [];
        let score = 0;
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('game-over');

        function initGame() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            gameOverElement.style.display = 'none';
            addRandomTile();
            addRandomTile();
            updateGrid();
        }

        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length > 0) {
                let pos = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[pos.r][pos.c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function updateGrid() {
            gridElement.innerHTML = '';
            scoreElement.textContent = score;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    const val = grid[r][c];
                    cell.className = `cell ${val > 0 ? 'val-' + val : ''}`;
                    cell.textContent = val > 0 ? val : '';
                    gridElement.appendChild(cell);
                }
            }
        }

        function slide(row) {
            row = row.filter(val => val);
            let newRow = [];
            for (let i = 0; i < row.length; i++) {
                if (row[i] === row[i + 1]) {
                    newRow.push(row[i] * 2);
                    score += row[i] * 2;
                    i++;
                } else {
                    newRow.push(row[i]);
                }
            }
            while (newRow.length < 4) newRow.push(0);
            return newRow;
        }

        function moveLeft() {
            let moved = false;
            for (let r = 0; r < 4; r++) {
                let row = grid[r];
                let newRow = slide(row);
                if (row.join(',') !== newRow.join(',')) moved = true;
                grid[r] = newRow;
            }
            return moved;
        }

        function moveRight() {
            let moved = false;
            for (let r = 0; r < 4; r++) {
                let row = grid[r].slice().reverse();
                let newRow = slide(row).reverse();
                if (grid[r].join(',') !== newRow.join(',')) moved = true;
                grid[r] = newRow;
            }
            return moved;
        }

        function moveUp() {
            let moved = false;
            for (let c = 0; c < 4; c++) {
                let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                let newCol = slide(col);
                for (let r = 0; r < 4; r++) {
                    if (grid[r][c] !== newCol[r]) moved = true;
                    grid[r][c] = newCol[r];
                }
            }
            return moved;
        }

        function moveDown() {
            let moved = false;
            for (let c = 0; c < 4; c++) {
                let col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
                let newCol = slide(col).reverse();
                for (let r = 0; r < 4; r++) {
                    if (grid[r][c] !== newCol[r]) moved = true;
                    grid[r][c] = newCol[r];
                }
            }
            return moved;
        }

        function checkGameOver() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return false;
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
                }
            }
            return true;
        }

        window.addEventListener('keydown', e => {
            // Prevent zooming/scrolling on arrow keys
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            let moved = false;
            if (e.key === 'ArrowLeft') moved = moveLeft();
            else if (e.key === 'ArrowRight') moved = moveRight();
            else if (e.key === 'ArrowUp') moved = moveUp();
            else if (e.key === 'ArrowDown') moved = moveDown();

            if (moved) {
                addRandomTile();
                updateGrid();
                if (checkGameOver()) gameOverElement.style.display = 'block';
            }
        });

        // Touch support for swiping
        let touchStartX = 0;
        let touchStartY = 0;

        gridElement.addEventListener('touchstart', e => {
            e.preventDefault();
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        gridElement.addEventListener('touchend', e => {
            e.preventDefault();
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
        }, { passive: false });

        function handleSwipe(startX, startY, endX, endY) {
            let diffX = endX - startX;
            let diffY = endY - startY;
            let moved = false;

            // Threshold for swipe
            if (Math.max(Math.abs(diffX), Math.abs(diffY)) < 30) return;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) moved = moveRight();
                else moved = moveLeft();
            } else {
                if (diffY > 0) moved = moveDown();
                else moved = moveUp();
            }

            if (moved) {
                addRandomTile();
                updateGrid();
                if (checkGameOver()) gameOverElement.style.display = 'block';
            }
        }

        initGame();
    </script>
</body>

</html>
