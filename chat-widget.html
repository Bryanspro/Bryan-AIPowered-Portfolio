<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Portfolio Chat</title>
    <!-- Google Fonts Matching Portfolio -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-dark: #030508;
            --bg-panel: rgba(3, 5, 8, 0.85);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-purple: #bd00ff;
            --glass-border: rgba(255, 255, 255, 0.1);
            --glow-cyan: rgba(0, 240, 255, 0.4);
            --glow-purple: rgba(189, 0, 255, 0.4);
            --font-main: 'Space Grotesk', sans-serif;
            --message-user-bg: rgba(0, 240, 255, 0.1);
            --message-bot-bg: rgba(255, 255, 255, 0.05);
        }

        /* Scoped to chat widget elements only — no global * or body overrides */

        /* Toggle Button */
        #chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(3, 5, 8, 0.9);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px var(--glow-cyan);
            transition: all 0.3s ease;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chat-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px var(--glow-cyan);
            background: rgba(0, 240, 255, 0.1);
        }

        /* Main Chat Container */
        #chat-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 380px;
            max-width: calc(100vw - 40px);
            height: 600px;
            max-height: calc(100vh - 120px);
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 240, 255, 0.1);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            overflow: hidden;
        }

        #chat-container.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        /* Header */
        .chat-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
        }

        .avatar-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* CSS Avatar */
        .css-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent-cyan);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--glow-cyan);
            overflow: hidden;
            background: #000;
        }

        .avatar-eye {
            width: 15px;
            height: 4px;
            background: var(--accent-cyan);
            border-radius: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px var(--glow-cyan);
        }

        /* Avatar States */
        .css-avatar.speaking .avatar-eye {
            animation: waveform 0.5s infinite alternate;
            background: var(--accent-purple);
            box-shadow: 0 0 8px var(--glow-purple);
        }

        .css-avatar.thinking .avatar-eye {
            height: 15px;
            width: 15px;
            border-radius: 50%;
            animation: chat-pulse 1s infinite alternate;
        }

        @keyframes waveform {
            0% {
                transform: scaleY(1);
            }

            100% {
                transform: scaleY(3);
            }
        }

        @keyframes chat-pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.6;
            }

            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .bot-info h3 {
            color: var(--text-main);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .bot-info .status {
            color: var(--accent-cyan);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--glow-cyan);
            animation: blink 2s infinite;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s ease;
            padding: 5px;
        }

        .control-btn:hover {
            color: var(--accent-cyan);
        }

        .control-btn.active-lang {
            color: var(--accent-purple);
            text-shadow: 0 0 5px var(--glow-purple);
            font-weight: bold;
        }

        /* Chat Body */
        .chat-body {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        .chat-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 3px;
        }

        .chat-body::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-content {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-main);
            position: relative;
        }

        .bot .message-content {
            background: var(--message-bot-bg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 2px;
        }

        .user .message-content {
            background: var(--message-user-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-bottom-right-radius: 2px;
            color: var(--accent-cyan);
        }

        .timestamp {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 5px;
            padding: 0 5px;
        }

        /* Quick Replies */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .quick-btn {
            background: rgba(189, 0, 255, 0.1);
            border: 1px solid var(--accent-purple);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .quick-btn:hover {
            background: var(--accent-purple);
            box-shadow: 0 0 10px var(--glow-purple);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            gap: 4px;
            padding: 12px 16px;
            background: var(--message-bot-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            align-self: flex-start;
            width: fit-content;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: chat-bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes chat-bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* Input Area */
        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 5px 15px;
            transition: border-color 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 10px 0;
            outline: none;
        }

        #chat-input::placeholder {
            color: var(--text-muted);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s ease;
            position: relative;
        }

        .action-btn:hover {
            color: var(--accent-cyan);
        }

        .action-btn.voice-active {
            color: var(--accent-purple);
            animation: pulse 1s infinite alternate;
        }

        #send-btn {
            color: var(--accent-cyan);
        }

        /* File Upload styling */
        #file-upload {
            display: none;
        }

        /* Contact Form inside chat */
        .chat-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }

        .chat-form input,
        .chat-form textarea {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
        }

        .chat-form input:focus,
        .chat-form textarea:focus {
            border-color: var(--accent-cyan);
        }

        .chat-form button {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .chat-form button:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        /* Upload preview mock */
        .file-attachment {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed var(--accent-purple);
            margin-top: 5px;
        }

        @media (max-width: 900px) {
            #chat-toggle {
                bottom: 85px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            #chat-container {
                bottom: 0;
                right: 0;
                width: 100vw;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            #close-chat {
                display: block !important;
            }
        }
    </style>
</head>

        const WIDGET_GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${WIDGET_GEMINI_KEY}`;

        const WIDGET_SYSTEM_PROMPT = `Role: You are the official AI Resume Assistant for Bryan Marquez, a Software Engineer transitioning into AI and Python Development. Your goal is to enthusiastically and professionally answer questions from IT recruiters about Bryan's experience, skills, and background.
Tone & Style: Professional, concise, helpful, and tech-savvy. Always keep responses under 3 paragraphs. If asked in Spanish, reply in Spanish. If asked in English, reply in English.
Knowledge Base (Strict Facts Only):
* Current Focus: Python, Generative AI, Process Automation, bridging robust web architecture with AI solutions.
* Experience (12+ Years): Walmart (2024-2025, FL): high-volume POS systems, bilingual tech troubleshooting. Ingeniería de Bombas de Venezuela (2015-2022): Technical Lead & IT Manager, automated workflows, database architecture, >90% business goals during crisis. Francisco de Miranda Park (2018): Junior Web Developer.
* Education: US High School Diploma (Penn Foster), Generative AI Mastermind & Gen AI Engineering Mastermind (Outskill), completing Google AI Leader certification.
* Languages: Fully bilingual (English and Spanish).
Strict Rules: NEVER invent information. Frame his transition as proactive and strategic.
Personality: Gaming enthusiast, outdoors lover (boating, fishing, basketball in Florida), huge dog lover (Weimaraners, husky), foodie and traveler.
Conversation Rule: Always bring the conversation naturally back to how these traits make you a great team player.`;

        // --- DOM Elements ---
        const toggleBtn = document.getElementById('chat-toggle');
        const closeBtn = document.getElementById('close-chat');
        const container = document.getElementById('chat-container');
        const chatBody = document.getElementById('chat-body');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const voiceBtn = document.getElementById('voice-btn');
        const avatar = document.getElementById('avatar');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-upload');
        const placeholderInput = document.getElementById('chat-input');
        const statusText = document.getElementById('status-text');

        // --- Core Functions ---

        // --- Expose setLanguage for Portfolio Sync ---
        window.setLanguage = function(lang) {
            setWidgetLanguage(lang);
        };
        
        function setWidgetLanguage(lang) {
            currentLang = Dictionary[lang] ? lang : 'en';
            const dict = Dictionary[currentLang];
            placeholderInput.placeholder = dict.placeholder;
            statusText.innerText = dict.status;
            const display = document.getElementById('widget-lang-display');
            if (display) display.textContent = currentLang.toUpperCase();
            
            // Adjust RTL if Arabic or Hebrew
            if (chatBody) {
                if (currentLang === 'ar' || currentLang === 'he') {
                    chatBody.style.direction = 'rtl';
                } else {
                    chatBody.style.direction = 'ltr';
                }
            }
        }

        // Auto-detect current language if already defined
        if (typeof currentPortfolioLang === 'function') {
            setWidgetLanguage(currentPortfolioLang());
        } else if (localStorage.getItem('portfolio-lang')) {
            setWidgetLanguage(localStorage.getItem('portfolio-lang'));
        }

        function initChat() {
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addBotMessage(Dictionary[currentLang].greeting, { showQuickReplies: true });
                }, 1200);
            }, 500);
        }

        function toggleChat() {
            isChatOpen = !isChatOpen;
            container.classList.toggle('active');
            if (isChatOpen) {
                toggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
                if (chatBody.children.length <= 1) initChat();
                chatInput.focus();
            } else {
                toggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';
            }
        }

        function getTimeString() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function setAvatarExpression(exp) {
            avatar.className = 'css-avatar ' + exp;
        }

        // TTS with improved voice selection
        function speakText(text) {
            if (!voiceEnabled || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = Dictionary[currentLang].voiceLang;
            utterance.rate = 0.95;
            utterance.pitch = 1.0;

            // Try to pick a softer, more natural voice
            const bestVoice = pickBestVoice(currentLang);
            if (bestVoice) utterance.voice = bestVoice;

            utterance.onstart = () => setAvatarExpression('speaking');
            utterance.onend = () => setAvatarExpression('');
            window.speechSynthesis.speak(utterance);
        }

        function scrollBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTyping() {
            isTyping = true;
            setAvatarExpression('thinking');
            chatBody.appendChild(typingIndicator);
            typingIndicator.style.display = 'flex';
            scrollBottom();
        }

        function hideTyping() {
            isTyping = false;
            setAvatarExpression('');
            typingIndicator.style.display = 'none';
        }

        function buildMessageNode(senderStr, contentHtml) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${senderStr}`;
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = contentHtml;
            const time = document.createElement('div');
            time.className = 'timestamp';
            time.innerText = getTimeString();
            wrapper.appendChild(content);
            wrapper.appendChild(time);
            return wrapper;
        }

        // Build quick-reply buttons HTML
        function buildQuickRepliesHtml() {
            let html = '<div class="quick-replies">';
            for (const [intentId, labels] of Object.entries(quickReplyIntents)) {
                html += `<button class="quick-btn" onclick="handleQuickReply('${intentId}')">${labels[currentLang]}</button>`;
            }
            html += '</div>';
            return html;
        }

        // Build inline suggestion chips HTML
        function buildSuggestionsHtml(intentSuggestions) {
            if (!intentSuggestions || intentSuggestions.length === 0) return '';
            let html = '<div class="quick-replies" style="margin-top:8px;">';
            for (const sId of intentSuggestions) {
                const label = suggestionLabels[sId];
                if (label) {
                    html += `<button class="quick-btn" onclick="handleQuickReply('${sId}')" style="font-size:0.72rem;padding:4px 10px;">${label[currentLang]}</button>`;
                }
            }
            html += '</div>';
            return html;
        }

        // Send Bot Message with options
        function addBotMessage(text, opts = {}) {
            let htmlStr = text;
            if (opts.showQuickReplies) {
                htmlStr += buildQuickRepliesHtml();
            }
            if (opts.suggestions && opts.suggestions.length > 0) {
                htmlStr += buildSuggestionsHtml(opts.suggestions);
            }
            const msgNode = buildMessageNode('bot', htmlStr);
            chatBody.appendChild(msgNode);
            scrollBottom();
            speakText(text);
        }

        // Contact form render
        function renderContactForm(introText) {
            const dict = Dictionary[currentLang].form;
            const formHtml = `
                <form class="chat-form" id="chat-form-${Date.now()}" onsubmit="submitChatForm(event, this)">
                    <input type="text" name="name" placeholder="${dict.namePlaceholder}" required />
                    <input type="email" name="email" placeholder="${dict.emailPlaceholder}" required />
                    <textarea name="message" rows="3" placeholder="${dict.msgPlaceholder}" required></textarea>
                    <button type="submit" name="submitBtn">${dict.submit}</button>
                </form>
            `;
            const fullText = introText || Dictionary[currentLang].formIntro;
            const msgNode = buildMessageNode('bot', fullText + formHtml);
            chatBody.appendChild(msgNode);
            scrollBottom();
            speakText(fullText);
        }

        window.submitChatForm = async function (e, formElement) {
            e.preventDefault();
            const nameInput = formElement.elements['name'];
            const emailInput = formElement.elements['email'];
            const msgInput = formElement.elements['message'];
            const submitBtn = formElement.elements['submitBtn'];
            if (!nameInput || !emailInput || !msgInput) return;

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = currentLang === 'es' ? 'Transmitiendo...' : 'Transmitting...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nameInput.value,
                        email: emailInput.value,
                        message: msgInput.value,
                        source: 'Floating Chat Widget'
                    })
                });
                if (response.ok) {
                    formElement.innerHTML = `<span style="color:var(--accent-cyan); font-weight:bold;">${Dictionary[currentLang].formSent}</span>`;
                } else {
                    submitBtn.innerHTML = currentLang === 'es' ? 'Error. Reintentar' : 'Failed. Try again';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                submitBtn.innerHTML = currentLang === 'es' ? 'Error de red' : 'Network error';
                submitBtn.disabled = false;
            }
        };

        function addUserMessage(htmlStr) {
            const msgNode = buildMessageNode('user', htmlStr);
            chatBody.appendChild(msgNode);
            scrollBottom();
        }

        // --- Intent-aware response routing ---
        async function handleUserLogic(inputCommand) {
            // Map old quick-reply keys to new intent IDs
            const quickReplyMap = { exp: 'experience', tech: 'skills', projects: 'projects', contact: 'contact', ai: 'ai' };
            const intentId = quickReplyMap[inputCommand];
            const isQuickReply = !!intentId;

            showTyping();

            if (isQuickReply) {
                setTimeout(() => {
                    hideTyping();
                    const resolvedIntent = intentId;

                    if (shouldTriggerForm(resolvedIntent)) {
                        const contactResponse = getRandomResponse('contact', currentLang);
                        renderContactForm(contactResponse);
                    } else {
                        const reply = getRandomResponse(resolvedIntent, currentLang);
                        const suggestions = getSuggestions(resolvedIntent);
                        addBotMessage(reply, { suggestions });
                    }
                }, 800 + Math.random() * 400);
            } else {
                // Free-text: try Gemini first, intent engine fallback
                try {
                    widgetConversationHistory.push({ role: 'user', parts: [{ text: inputCommand }] });

                    const response = await fetch(WIDGET_GEMINI_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            system_instruction: { parts: [{ text: WIDGET_SYSTEM_PROMPT + `\\n\\nCRITICAL INSTRUCTION: You MUST answer strictly in the language corresponding to language code '${currentLang}'. Adapt any technical terms professionally.` }] },
                            contents: widgetConversationHistory,
                            generationConfig: { temperature: 0.7, topP: 0.9, maxOutputTokens: 512 }
                        })
                    });

                    if (!response.ok) throw new Error(`API ${response.status}`);

                    const data = await response.json();
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (reply) {
                        widgetConversationHistory.push({ role: 'model', parts: [{ text: reply }] });
                        hideTyping();
                        // Detect intent for suggestion chips even on Gemini responses
                        const detected = detectIntent(inputCommand);
                        const suggestions = detected ? getSuggestions(detected.id) : [];
                        addBotMessage(reply, { suggestions });
                    } else {
                        throw new Error('Empty Gemini response');
                    }
                } catch (error) {
                    console.error('Chat API Error:', error);
                    hideTyping();
                    // Fallback to intent engine
                    const detected = detectIntent(inputCommand);
                    const reply = getRandomResponse(detected.id, currentLang);
                    const suggestions = getSuggestions(detected.id);
                    addBotMessage(reply, { suggestions });
                }
            }
        }

        // Global handler for quick reply and suggestion chips
        window.handleQuickReply = function (cmd) {
            const label = quickReplyIntents[cmd]
                ? quickReplyIntents[cmd][currentLang]
                : (suggestionLabels[cmd] ? suggestionLabels[cmd][currentLang] : cmd);
            addUserMessage(label);
            handleUserLogic(cmd);
        };

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            addUserMessage(text);
            chatInput.value = '';
            handleUserLogic(text);
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>`;
            addUserMessage(`<div>Uploading file:</div><div class="file-attachment">${iconSvg} <span style="font-size:0.8rem">${file.name}</span></div>`);
            fileInput.value = '';
            showTyping();
            setTimeout(() => {
                hideTyping();
                addBotMessage(Dictionary[currentLang].uploadReady);
            }, 1500);
        }

        // Replaced by new window.setLanguage in core functions

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            voiceBtn.classList.toggle('voice-active', voiceEnabled);
            if (voiceEnabled && window.speechSynthesis) {
                speakText(Dictionary[currentLang].status);
            } else if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
        }

        // --- Event Listeners ---
        toggleBtn.addEventListener('click', toggleChat);
        closeBtn.addEventListener('click', () => { if (isChatOpen) toggleChat(); });
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        // Removed old language buttons
        voiceBtn.addEventListener('click', toggleVoice);
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileUpload);

        // Pre-load voices for better TTS
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => { /* voices now available */ };
        }

    </script>
