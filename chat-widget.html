<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Portfolio Chat</title>
    <!-- Google Fonts Matching Portfolio -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-dark: #030508;
            --bg-panel: rgba(3, 5, 8, 0.85);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-purple: #bd00ff;
            --glass-border: rgba(255, 255, 255, 0.1);
            --glow-cyan: rgba(0, 240, 255, 0.4);
            --glow-purple: rgba(189, 0, 255, 0.4);
            --font-main: 'Space Grotesk', sans-serif;
            --message-user-bg: rgba(0, 240, 255, 0.1);
            --message-bot-bg: rgba(255, 255, 255, 0.05);
        }

        /* Scoped to chat widget elements only — no global * or body overrides */

        /* Toggle Button */
        #chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(3, 5, 8, 0.9);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px var(--glow-cyan);
            transition: all 0.3s ease;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chat-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px var(--glow-cyan);
            background: rgba(0, 240, 255, 0.1);
        }

        /* Main Chat Container */
        #chat-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 380px;
            max-width: calc(100vw - 40px);
            height: 600px;
            max-height: calc(100vh - 120px);
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 240, 255, 0.1);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            overflow: hidden;
        }

        #chat-container.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        /* Header */
        .chat-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
        }

        .avatar-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* CSS Avatar */
        .css-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent-cyan);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--glow-cyan);
            overflow: hidden;
            background: #000;
        }

        .avatar-eye {
            width: 15px;
            height: 4px;
            background: var(--accent-cyan);
            border-radius: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px var(--glow-cyan);
        }

        /* Avatar States */
        .css-avatar.speaking .avatar-eye {
            animation: waveform 0.5s infinite alternate;
            background: var(--accent-purple);
            box-shadow: 0 0 8px var(--glow-purple);
        }

        .css-avatar.thinking .avatar-eye {
            height: 15px;
            width: 15px;
            border-radius: 50%;
            animation: chat-pulse 1s infinite alternate;
        }

        @keyframes waveform {
            0% {
                transform: scaleY(1);
            }

            100% {
                transform: scaleY(3);
            }
        }

        @keyframes chat-pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.6;
            }

            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .bot-info h3 {
            color: var(--text-main);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .bot-info .status {
            color: var(--accent-cyan);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--glow-cyan);
            animation: blink 2s infinite;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s ease;
            padding: 5px;
        }

        .control-btn:hover {
            color: var(--accent-cyan);
        }

        .control-btn.active-lang {
            color: var(--accent-purple);
            text-shadow: 0 0 5px var(--glow-purple);
            font-weight: bold;
        }

        /* Chat Body */
        .chat-body {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        .chat-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 3px;
        }

        .chat-body::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-content {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-main);
            position: relative;
        }

        .bot .message-content {
            background: var(--message-bot-bg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 2px;
        }

        .user .message-content {
            background: var(--message-user-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-bottom-right-radius: 2px;
            color: var(--accent-cyan);
        }

        .timestamp {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 5px;
            padding: 0 5px;
        }

        /* Quick Replies */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .quick-btn {
            background: rgba(189, 0, 255, 0.1);
            border: 1px solid var(--accent-purple);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .quick-btn:hover {
            background: var(--accent-purple);
            box-shadow: 0 0 10px var(--glow-purple);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            gap: 4px;
            padding: 12px 16px;
            background: var(--message-bot-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            align-self: flex-start;
            width: fit-content;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: chat-bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes chat-bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* Input Area */
        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 5px 15px;
            transition: border-color 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 10px 0;
            outline: none;
        }

        #chat-input::placeholder {
            color: var(--text-muted);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s ease;
            position: relative;
        }

        .action-btn:hover {
            color: var(--accent-cyan);
        }

        .action-btn.voice-active {
            color: var(--accent-purple);
            animation: pulse 1s infinite alternate;
        }

        #send-btn {
            color: var(--accent-cyan);
        }

        /* File Upload styling */
        #file-upload {
            display: none;
        }

        /* Contact Form inside chat */
        .chat-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }

        .chat-form input,
        .chat-form textarea {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
        }

        .chat-form input:focus,
        .chat-form textarea:focus {
            border-color: var(--accent-cyan);
        }

        .chat-form button {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .chat-form button:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        /* Upload preview mock */
        .file-attachment {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed var(--accent-purple);
            margin-top: 5px;
        }

        @media (max-width: 900px) {
            #chat-toggle {
                bottom: 85px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            #chat-container {
                bottom: 0;
                right: 0;
                width: 100vw;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            #close-chat {
                display: block !important;
            }
        }
    </style>
</head>

    <!-- Floating Toggle Button -->
    <button id="chat-toggle" aria-label="Open Chat">

            { keywords: ['contact', 'reach', 'email', 'message', 'connect', 'hire', 'contacto', 'mensaje'], response: { en: "You can reach Bryan via the contact form on his portfolio, or connect on LinkedIn. He's always open to new opportunities and typically replies within 24-48 hours!", es: "Puedes contactar a Bryan a través de su formulario o en LinkedIn. ¡Siempre está abierto a nuevas oportunidades y suele responder en 24-48 horas!" } },
            { keywords: ['education', 'certif', 'degree', 'school', 'study', 'educacion', 'estudio'], response: { en: "Bryan's credentials: US High School Diploma (Penn Foster), Generative AI Mastermind & Gen AI Engineering Mastermind (Outskill), currently completing Google AI Leader and Professional certifications.", es: "Credenciales: Diploma de High School de EE. UU. (Penn Foster), Mastermind en IA Generativa (Outskill), actualmente completando Google AI Leader." } },
            { keywords: ['flaw', 'weakness', 'improve', 'debilidad', 'mejora'], response: { en: "I tend to want to build custom AI solutions from scratch — but I've learned to balance that instinct by evaluating simpler existing solutions first. Adapting to US corporate culture has been a learning curve I'm actively overcoming through networking and certifications.", es: "A veces quiero construir soluciones a la medida desde cero, pero he aprendido a evaluar primero opciones más simples. Adaptarme a la cultura corporativa de EE. UU. ha sido una curva de aprendizaje." } },
            { keywords: ['hello', 'hi', 'hey', 'sup', 'good morning', 'good afternoon', 'good evening', 'hola', 'buenos', 'buenas'], response: { en: "Hey there! I'm Bryan's AI Assistant. Ask me about his experience, tech stack, AI skills, portfolio projects, apps, or fun facts — or use the quick reply buttons below!", es: "¡Hola! Soy el asistente IA de Bryan. Pregúntame sobre su experiencia, habilidades técnicas, proyectos o pasatiempos. ¡O usa los botones rápidos!" } },
            { keywords: ['portfolio', 'porfolio', 'portfolo', 'portolio', 'website', 'site', 'page', 'web', 'this', 'pagina', 'sitio'], response: { en: "This portfolio is Bryan's professional AI showcase, built with HTML, CSS, and JavaScript. It features: a Hero section with typewriter animation, About section (12+ years experience), Skills matrix (Languages, AI & Automation, Leadership), Experience timeline (Walmart, Ingeniería de Bombas, Francisco de Miranda Park), 4 Projects in a carousel, 6 fully functional Apps (AI Chatbox, ArtVault, BookNest, Chronos Elegance, Clock, PlanFlow), Contact form, and this AI Chat Widget. It uses a dark theme with glassmorphism and cyan/purple accents.", es: "Este portafolio muestra el trabajo de Bryan con HTML, CSS, JS e Inteligencia Artificial, incluyendo proyectos completos, una línea de tiempo y este chatbot asistente." } },
            { keywords: ['what can', 'help', 'what do you', 'can you', 'your purpose', 'what are you', 'options', 'menu', 'ayuda'], response: { en: "I'm Bryan's AI portfolio assistant! I can help with: Experience (12+ years across 3 companies), Tech Stack (Python, JS, AI tools), AI Skills (GenAI, Prompt Engineering), Portfolio Projects (4 showcase projects), Apps Gallery (6 live apps), Education & Certifications, Fun Facts & Hobbies, Contact Info, and Design details. Just ask or use the quick reply buttons!", es: "¡Soy el asistente del portafolio! Puedo ayudarte con: Experiencia de Bryan, Tecnologías, Proyectos de IA, y más. ¡Pregúntame o usa los botones rápidos!" } },
            { keywords: ['project', 'projects', 'built', 'showcase', 'compiled', 'output', 'proyecto'], response: { en: "Bryan's portfolio showcases 4 projects: Product Designer Showcase (HTML/CSS, GenAI), Interactive Games (JavaScript, HTML5 Canvas), Apps Showcase (modular web apps), and AI-Powered Applications (4 AI apps: Chatbox, Text Summarizer, Quiz Generator, Mood Journal — all Gemini-powered).", es: "El portafolio incluye 4 proyectos principales: galería de diseño de producto, juegos interactivos, galería de apps integrales, y aplicaciones potenciadas por IA." } },
            { keywords: ['app', 'apps', 'application', 'applications', 'gallery', 'aplicacion', 'aplicaciones'], response: { en: "Bryan's Apps Gallery includes 6 fully functional web apps: AI Chatbox (this Gemini-powered assistant), ArtVault (art gallery), BookNest (book discovery), Chronos Elegance (premium clock/timer), Clock App (minimal clock), and PlanFlow (task planning). All feature modern dark themes and responsive designs!", es: "La Galería de Apps de Bryan incluye grandes proyectos: este Asistente IA, ArtVault, BookNest, Chronos Elegance, PlanFlow y Clock App." } },
            { keywords: ['skill', 'skills', 'abilities', 'capable', 'matrix', 'habilidad'], response: { en: "Bryan's skills: Languages & Systems (HTML/CSS/JS, Python, WordPress, SQL, System Admin), AI & Automation (Generative AI/LLMs, AI Engineering, Prompt Engineering, AI Agent Automation), Leadership (Project Management, Team Leadership, Strategic Problem Solving, Cross-Cultural Communication EN/ES). 12+ years experience, 20+ projects.", es: "Habilidades de Bryan: Python, HTML/CSS/JS, IA Generativa, liderazgo de equipos y automatización de procesos. Bilingüe y con más de 12 años de experiencia." } },
            { keywords: ['about', 'who', 'bryan', 'introduce', 'bio', 'himself', 'summary', 'quien'], response: { en: "Bryan Marquez is a Software Engineer with 12+ years of experience. After leading teams as Technical Lead in Venezuela, he relocated to the US. Today he specializes in AI and Evolving System Development using Python, integrating Generative AI and LLMs with his engineering foundation. Fully bilingual (EN/ES) with 20+ projects.", es: "Bryan Marquez es un Ingeniero de Software con más de 12 años de experiencia. Se especializa en la integración de Inteligencia Artificial Generativa y desarrollo en Python." } },
            { keywords: ['design', 'theme', 'color', 'look', 'aesthetic', 'style', 'dark', 'diseno'], response: { en: "The portfolio uses a premium dark theme: deep backgrounds (#0a0a0f) with cyan (#00f0ff) and purple (#bd00ff) accents, glassmorphism cards, animated particle canvas, typewriter hero text, holographic ring visual, Space Grotesk typography, and fully responsive design.", es: "El diseño utiliza un tema oscuro premium con acentos neón en cyan y púrpura, diseño glassmorphism, fondo de partículas animado y tipografía retro futurística." } },
            { keywords: ['made', 'build', 'how', 'create', 'developed', 'framework', 'creado', 'hecho'], response: { en: "This portfolio was built with vanilla HTML5, CSS3, and JavaScript — no heavy frameworks. The AI uses Gemini 2.0 Flash API via direct REST calls. Custom CSS with glassmorphism, pure CSS animations, JavaScript canvas for particles, and a custom-built chat system with TTS. Bryan built everything from scratch!", es: "Este portafolio fue creado completamente desde cero, usando HTML5, CSS3, y JavaScript (sin frameworks). El bot utiliza la API Rest directa a Gemini 2.0 Flash." } }
        ];
        const WIDGET_GENERIC_FALLBACK = {
            en: "Bryan is a Software Engineer with 12+ years of experience, specializing in Python, Generative AI, and Process Automation. Ask about his experience, skills, projects, apps, portfolio, or hobbies — I have answers ready!",
            es: "Bryan es un Ingeniero de Software con más de 12 años de experiencia especializado en Python e IA. Pregúntame sobre sus proyectos o experiencia."
        };

        function getWidgetPrefab(input) {
            const lower = input.toLowerCase();
            let best = null, bestScore = 0;
            for (const entry of WIDGET_PREFABS) {
                let score = 0;
                for (const kw of entry.keywords) { if (lower.includes(kw)) score++; }
                if (score > bestScore) { bestScore = score; best = entry; }
            }
            return best ? best.response[currentLang] : WIDGET_GENERIC_FALLBACK[currentLang];
        }

        // --- DOM Elements ---
        const toggleBtn = document.getElementById('chat-toggle');
        const closeBtn = document.getElementById('close-chat');
        const container = document.getElementById('chat-container');
        const chatBody = document.getElementById('chat-body');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const langEnBtn = document.getElementById('lang-en');
        const langEsBtn = document.getElementById('lang-es');
        const voiceBtn = document.getElementById('voice-btn');
        const avatar = document.getElementById('avatar');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-upload');
        const placeholderInput = document.getElementById('chat-input');
        const statusText = document.getElementById('status-text');

        // --- Core Functions ---

        // Initialize Chat
        function initChat() {
            // Delay greeting slightly for effect
            setTimeout(() => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addBotMessage(Dictionary[currentLang].greeting, true);
                }, 1200);
            }, 500);
        }

        // Toggle Chat Window
        function toggleChat() {
            isChatOpen = !isChatOpen;
            container.classList.toggle('active');

            // Swap icon based on state
            if (isChatOpen) {
                toggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
                if (chatBody.children.length <= 1) initChat();
                chatInput.focus();
            } else {
                toggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';
            }
        }

        // Generate Time String
        function getTimeString() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Avatar Expressions
        function setAvatarExpression(exp) {
            avatar.className = 'css-avatar ' + exp;
        }

        // Speech Synthesis (TTS)
        function speakText(text) {
            if (!voiceEnabled || !window.speechSynthesis) return;

            window.speechSynthesis.cancel(); // Stop talking currently
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = Dictionary[currentLang].voiceLang;

            utterance.onstart = () => setAvatarExpression('speaking');
            utterance.onend = () => setAvatarExpression('');

            window.speechSynthesis.speak(utterance);
        }

        // UI Updates
        function scrollBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTyping() {
            isTyping = true;
            setAvatarExpression('thinking');
            chatBody.appendChild(typingIndicator);
            typingIndicator.style.display = 'flex';
            scrollBottom();
        }

        function hideTyping() {
            isTyping = false;
            setAvatarExpression('');
            typingIndicator.style.display = 'none';
        }

        // Construct HTML Message wrappers
        function buildMessageNode(senderStr, contentHtml) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${senderStr}`;

            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = contentHtml;

            const time = document.createElement('div');
            time.className = 'timestamp';
            time.innerText = getTimeString();

            wrapper.appendChild(content);
            wrapper.appendChild(time);
            return wrapper;
        }

        // Send Bot Message with optional Quick Replies
        function addBotMessage(text, includeQuickReplies = false) {
            let htmlStr = text;

            if (includeQuickReplies) {
                const dict = Dictionary[currentLang].quick;
                htmlStr += `<div class="quick-replies">
                    <button class="quick-btn" onclick="handleQuickReply('exp')">${dict.exp}</button>
                    <button class="quick-btn" onclick="handleQuickReply('tech')">${dict.tech}</button>
                    <button class="quick-btn" onclick="handleQuickReply('projects')">${dict.projects}</button>
                    <button class="quick-btn" onclick="handleQuickReply('contact')">${dict.contact}</button>
                </div>`;
            }

            const msgNode = buildMessageNode('bot', htmlStr);
            chatBody.appendChild(msgNode);
            scrollBottom();
            speakText(text); // Speak if enabled
        }

        // Special render for contact form inside chat
        function renderContactForm() {
            const dict = Dictionary[currentLang].form;
            const formHtml = `
                <div class="chat-form" id="in-chat-form">
                    <input type="text" placeholder="${dict.namePlaceholder}" required />
                    <input type="email" placeholder="${dict.emailPlaceholder}" required />
                    <textarea rows="3" placeholder="${dict.msgPlaceholder}" required></textarea>
                    <button type="submit" onclick="submitChatForm(event)">${dict.submit}</button>
                </div>
            `;
            const msgNode = buildMessageNode('bot', Dictionary[currentLang].responses.formIntro + formHtml);
            chatBody.appendChild(msgNode);
            scrollBottom();
            speakText(Dictionary[currentLang].responses.formIntro);
        }

        window.submitChatForm = function (e) {
            e.preventDefault();
            const form = document.getElementById('in-chat-form');
            form.innerHTML = `<span style="color:var(--accent-cyan); font-weight:bold;">${Dictionary[currentLang].responses.formSent}</span>`;
        };

        // User Message handler
        function addUserMessage(htmlStr) {
            const msgNode = buildMessageNode('user', htmlStr);
            chatBody.appendChild(msgNode);
            scrollBottom();
        }

        // Logic routing for bot responses
        async function handleUserLogic(inputCommand) {
            let isQuickReply = false;
            let responseKey = '';
            let showForm = false;

            // Direct match for quick reply buttons
            if (inputCommand === 'exp') {
                isQuickReply = true;
                responseKey = 'exp';
            } else if (inputCommand === 'tech') {
                isQuickReply = true;
                responseKey = 'tech';
            } else if (inputCommand === 'projects') {
                isQuickReply = true;
                responseKey = 'projects';
            } else if (inputCommand === 'contact') {
                isQuickReply = true;
                showForm = true;
            }

            showTyping();

            if (isQuickReply) {
                // Static 1-second delay for quick replies
                setTimeout(() => {
                    hideTyping();
                    if (showForm) {
                        renderContactForm();
                    } else {
                        // Send response and append quick links again
                        addBotMessage(Dictionary[currentLang].responses[responseKey], true);
                    }
                }, 1000);
            } else {
                // Direct Gemini API Integration with Prefab Fallback
                try {
                    widgetConversationHistory.push({ role: 'user', parts: [{ text: inputCommand }] });

                    const response = await fetch(WIDGET_GEMINI_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            system_instruction: { parts: [{ text: WIDGET_SYSTEM_PROMPT + `\n\nCRITICAL INSTRUCTION: The user's interface is currently set to ${currentLang === 'es' ? 'SPANISH. You MUST reply in Spanish.' : 'ENGLISH. You MUST reply in English.'}` }] },
                            contents: widgetConversationHistory,
                            generationConfig: { temperature: 0.7, topP: 0.9, maxOutputTokens: 512 }
                        })
                    });

                    if (!response.ok) throw new Error(`API ${response.status}`);

                    const data = await response.json();
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || getWidgetPrefab(inputCommand);
                    widgetConversationHistory.push({ role: 'model', parts: [{ text: reply }] });

                    hideTyping();
                    addBotMessage(reply);

                } catch (error) {
                    hideTyping();
                    console.error('Chat API Error:', error);
                    const prefab = getWidgetPrefab(inputCommand);
                    addBotMessage(prefab);
                }
            }
        }

        // Global exposing for quick reply buttons injected via innerHTML
        window.handleQuickReply = function (cmd) {
            const label = Dictionary[currentLang].quick[cmd];
            addUserMessage(label);
            handleUserLogic(cmd);
        };

        // Primary Event Handler for sending text
        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addUserMessage(text);
            chatInput.value = '';

            handleUserLogic(text);
        }

        // Handling File Upload Mock
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>`;

            const html = `
                <div>Uploading file:</div>
                <div class="file-attachment">
                    ${iconSvg} 
                    <span style="font-size:0.8rem">${file.name}</span>
                </div>
            `;

            addUserMessage(html);
            fileInput.value = ''; // reset

            showTyping();
            setTimeout(() => {
                hideTyping();
                addBotMessage(Dictionary[currentLang].responses.uploadReady);
            }, 1500);
        }

        // Switch Language
        function setLanguage(lang, fromSync = false) {
            if (currentLang === lang && fromSync) return;
            currentLang = lang;

            // Update UI
            langEnBtn.classList.toggle('active-lang', lang === 'en');
            langEsBtn.classList.toggle('active-lang', lang === 'es');

            placeholderInput.placeholder = Dictionary[lang].placeholder;
            statusText.innerText = Dictionary[lang].status;

            // Stop speaking previous lang
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            // Sync portfolio language if available
            if (!fromSync && typeof window.setPortfolioLanguage === 'function') {
                window.setPortfolioLanguage(lang, true);
            }
        }

        // Expose globally so portfolio can call it
        window.setLanguage = setLanguage;

        // Toggle Voice
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            voiceBtn.classList.toggle('voice-active', voiceEnabled);

            if (voiceEnabled && window.speechSynthesis) {
                // Test Speak
                speakText(Dictionary[currentLang].status);
            } else if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
        }

        // --- Event Listeners ---
        toggleBtn.addEventListener('click', toggleChat);
        closeBtn.addEventListener('click', () => { if (isChatOpen) toggleChat(); });
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Language toggle listeners
        langEnBtn.addEventListener('click', () => setLanguage('en'));
        langEsBtn.addEventListener('click', () => setLanguage('es'));

        // Voice toggle listener
        voiceBtn.addEventListener('click', toggleVoice);

        // Upload listeners
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileUpload);

    </script>
</body>

</html>
