<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>BookNest — Digital Library</title>
    <meta name="description" content="BookNest is a premium personal digital library for tracking your reading journey.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <div class="app-container">
        <main class="content-area">

            <!-- ═══ Library View ═══ -->
            <section id="view-library" class="view active">
                <header class="section-header">
                    <h2>My Library</h2>
                </header>

                <div class="library-tabs">
                    <button class="tab-btn active" data-status="reading">📖 Reading</button>
                    <button class="tab-btn" data-status="want">✨ Want</button>
                    <button class="tab-btn" data-status="completed">✅ Done</button>
                </div>

                <div class="book-list" id="library-list"></div>
            </section>

            <!-- ═══ Explore View ═══ -->
            <section id="view-explore" class="view">
                <header class="section-header">
                    <h2>Explore</h2>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="explore-search" placeholder="Search books, authors, genres..." autocomplete="off">
                    </div>
                </header>

                <div class="filters-scroll">
                    <button class="filter-chip active" data-genre="all">All</button>
                    <button class="filter-chip" data-genre="Classic">Classic</button>
                    <button class="filter-chip" data-genre="Adventure">Adventure</button>
                    <button class="filter-chip" data-genre="Epic">Epic</button>
                    <button class="filter-chip" data-genre="Fiction">Fiction</button>
                </div>

                <div class="book-grid" id="explore-grid"></div>
            </section>

            <!-- ═══ Stats View ═══ -->
            <section id="view-stats" class="view">
                <header class="section-header">
                    <h2>Reading Stats</h2>
                </header>

                <div class="stats-panel">
                    <div class="stat-card">
                        <span class="stat-num" id="stat-books-read">0</span>
                        <span class="stat-label">Books Read</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-num" id="stat-pages-read">0</span>
                        <span class="stat-label">Pages Turned</span>
                    </div>
                </div>

                <div class="section-title" style="margin-top: 24px;">
                    <h3>Favorite Reads</h3>
                </div>
                <div class="horizontal-scroll-list" id="stats-favorites"></div>
            </section>
        </main>

        <!-- ═══ Bottom Navigation ═══ -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-view="view-library" aria-label="Library">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span>Library</span>
            </button>
            <button class="nav-item" data-view="view-explore" aria-label="Explore">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span>Explore</span>
            </button>
            <button class="nav-item" data-view="view-stats" aria-label="Stats">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 20V10"></path>
                    <path d="M12 20V4"></path>
                    <path d="M6 20v-6"></path>
                </svg>
                <span>Stats</span>
            </button>
        </nav>

        <!-- ═══ Book Detail Overlay ═══ -->
        <div id="book-detail" class="detail-overlay hidden">
            <button class="back-btn" id="close-detail" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Back
            </button>

            <div class="detail-header-bg">
                <div class="book-cover-large" id="detail-cover"></div>
            </div>

            <div class="detail-content">
                <div class="detail-primary-info">
                    <h2 id="detail-title">Book Title</h2>
                    <p id="detail-author">Author Name</p>
                    <div class="detail-meta">
                        <span id="detail-year">2020</span> ·
                        <span id="detail-pages">300 pages</span> ·
                        <span id="detail-genre">Genre</span>
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="action-bar">
                    <button class="btn btn-primary" id="btn-status">Add to Library</button>
                    <button class="icon-btn-round" id="btn-favorite" aria-label="Toggle favorite">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                </div>

                <!-- Read PDF Button -->
                <div id="pdf-container" class="book-section">
                    <button class="btn btn-pdf" id="btn-read-pdf" style="width:100%;">
                        📄 Read PDF
                    </button>
                </div>

                <!-- Progress Tracker -->
                <div id="progress-container" class="book-section hidden">
                    <h3>Reading Progress</h3>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="detail-progress-fill"></div>
                    </div>
                    <div class="progress-slider-wrap">
                        <input type="range" id="progress-slider" min="0" max="100" value="0">
                        <p class="progress-text"><span id="progress-value">0</span> / <span id="progress-total">100</span> pages</p>
                    </div>
                </div>

                <!-- Synopsis -->
                <div class="book-section">
                    <h3>Synopsis</h3>
                    <p id="detail-synopsis">Synopsis goes here...</p>
                </div>

                <!-- Notes -->
                <div class="book-section" id="notes-container">
                    <h3>Personal Notes</h3>
                    <textarea id="detail-notes" placeholder="Write your thoughts here..."></textarea>
                    <button class="btn btn-outline" id="save-notes" style="width:100%;margin-top:10px;">Save Notes</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
